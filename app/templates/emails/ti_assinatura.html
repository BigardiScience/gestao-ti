{% extends "emails/_base.html" %}
{% block corpo %}
<p style="margin:0 0 14px;font-size:18px;font-weight:700;">{{ termo.colaborador_nome }} assinou o termo {{ termo.codigo }}</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 16px;width:100%;font-size:14px;">
  <tr><td style="padding:5px 0;color:#475467;width:40%;">Aparelho</td><td style="padding:5px 0;">{{ termo.marca }} {{ termo.modelo }}</td></tr>
  <tr><td style="padding:5px 0;color:#475467;">IMEI</td><td style="padding:5px 0;">{{ termo.imei }}</td></tr>
  <tr><td style="padding:5px 0;color:#475467;">Unidade</td><td style="padding:5px 0;">{{ termo.unidade_nome }}</td></tr>
  <tr><td style="padding:5px 0;color:#475467;">Assinado em</td><td style="padding:5px 0;">{{ termo.assinado_em|datahora }}</td></tr>
</table>
<table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="background:#172033;border-radius:8px;">
  <a href="{{ url }}" target="_blank" style="display:inline-block;padding:11px 18px;color:#ffffff;text-decoration:none;font-weight:700;">Ver termo na plataforma</a>
</td></tr></table>
{% endblock %}
