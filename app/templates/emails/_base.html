<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ empresa }}</title></head>
<body style="margin:0;padding:0;background:#f2f4f7;font-family:'Segoe UI',Arial,sans-serif;color:#172033;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f4f7;padding:24px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e3e7ed;border-radius:12px;">
      <tr><td style="padding:22px 28px 0 28px;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="background:#ffc72c;border:1px solid #e0a800;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700;color:#172033;">{% block selo %}Celulares corporativos{% endblock %}</td>
          <td style="padding-left:10px;font-size:13px;color:#475467;">{{ empresa }}</td>
        </tr></table>
      </td></tr>
      <tr><td style="padding:18px 28px 26px 28px;font-size:15px;line-height:1.6;">
        {% block corpo %}{% endblock %}
      </td></tr>
    </table>
    <p style="max-width:560px;font-size:12px;color:#667085;line-height:1.5;margin:14px auto 0;">
      {% block rodape %}Mensagem automática da plataforma de gestão de celulares corporativos de {{ empresa }}. Não responda este e-mail.{% endblock %}
    </p>
  </td></tr>
</table>
</body>
</html>
